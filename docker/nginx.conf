# Dashboard + same-origin proxy to the API container.
server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    # Two uploads of up to API_MAX_UPLOAD_BYTES (1 MiB) plus multipart overhead.
    client_max_body_size 3m;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The API sets its own security headers (and a strict CSP on the HTML report).
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Job polls long-poll for up to API_WAIT_TIMEOUT_SECONDS (30 s by default).
        proxy_read_timeout 120s;
    }

    location / {
        # Recharts sets inline style attributes, hence 'unsafe-inline' for styles only.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri $uri/ /index.html;
    }
}
